# Comprobación automática en cada pull request y en cada push a main:
# instala dependencias, pasa el lint y compila. Si falla, no se fusiona.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint 2>&1 | tee lint.log
      - name: Build
        # La compilación no necesita claves: la web pública funciona sin Supabase.
        run: npm run build 2>&1 | tee build.log
      - name: Resumen del error
        # Si algo falla, copia el final del registro en una anotación del PR
        # (visible en «Checks» y legible desde la API sin descargar los logs).
        if: failure()
        run: |
          for f in lint.log build.log; do
            [ -s "$f" ] || continue
            msg=$(tail -n 60 "$f" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=${f}::${msg}"
          done
